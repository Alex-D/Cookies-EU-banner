name: "Test"

on:
  push:
  pull_request:

jobs:
  test:
    name: "Checks & Tests"
    runs-on: "ubuntu-latest"
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - run: vp install

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(vp pm ls playwright --depth 1 | grep -oE 'playwright@[0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install --with-deps --only-shell

      - name: Only install OS dependencies for browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: vpx playwright install-deps

      - run: vp check
      - run: vp test --coverage

  test-dist:
    name: "Test dist"
    runs-on: "ubuntu-latest"
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - name: Install Playwright Browsers
        run: vpx playwright install --with-deps --only-shell
      - run: vp run test:dist
