packages:
  - .
  - docs

allowBuilds:
  esbuild: true

catalog:
  "@types/node": ^26.4.1
  "@vitest/browser-playwright": ^4.1.11
  "@vitest/coverage-istanbul": 4.1.11
  astro: ^7.2.10
  bumpp: ^12.3.0
  playwright: ^1.63.0
  typescript: npm:typescript-native-bridge@^6.0.3-bridge.15.tsgo.7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0

catalogMode: strict

linkWorkspacePackages: true

overrides:
  vite@*: "catalog:"
  playwright@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
