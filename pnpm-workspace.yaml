packages:
  - .
  - docs

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

catalog:
  "@astrojs/markdown-satteri": ^0.4.5
  "@astrojs/mdx": ^8.1.1
  "@types/node": ^26.6.5
  "@vitest/browser-playwright": ^5.0.5
  "@vitest/coverage-istanbul": ^5.0.5
  astro: ^7.4.2
  bumpp: ^12.3.0
  playwright: ^1.64.1
  sass: ^1.106.0
  sharp: ^0.35.4
  subset-font: ^2.7.0
  typescript: npm:typescript-native-bridge@^6.0.3-bridge.18.tsgo.7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

catalogMode: strict

linkWorkspacePackages: true

overrides:
  vite@*: "catalog:"
  playwright@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
